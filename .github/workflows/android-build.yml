name: Android Build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    name: Build real WebAssembly game assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git

      - name: Install pinned emsdk
        run: |
          set -euo pipefail
          tag=$(python3 -c "import json;print(next(s['tag'] for s in json.load(open('ThirdParty/sources.json'))['sources'] if s['name']=='emsdk'))")
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" install "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$tag"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Configure WebAssembly build
        run: source "$EMSDK/emsdk_env.sh" && cmake --preset web-wasm64

      - name: Build WebAssembly game
        run: source "$EMSDK/emsdk_env.sh" && cmake --build --preset web-wasm64

      - name: Verify and upload WebAssembly assets
        run: |
          test -s dist/web-wasm64/hp2_game.js
          test -s dist/web-wasm64/hp2_game.wasm
          ! grep -qi "placeholder" dist/web-wasm64/hp2_game.js
          du -h dist/web-wasm64/hp2_game.js dist/web-wasm64/hp2_game.wasm
        # Keep the browser shell, fonts, and actual compiled engine together.
        # The Android job packages these exact files into its APK.
      - uses: actions/upload-artifact@v4
        with:
          name: hp2-web-assets
          path: dist/web-wasm64/
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled game assets
        uses: actions/download-artifact@v4
        with:
          name: hp2-web-assets
          path: Android/app/src/main/assets/web

      - name: Confirm APK will contain the real game module
        run: |
          test -s Android/app/src/main/assets/web/hp2_game.js
          test -s Android/app/src/main/assets/web/hp2_game.wasm
          ! grep -qi "placeholder" Android/app/src/main/assets/web/hp2_game.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: Android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Annotate failure
        if: failure()
        working-directory: Android
        run: |
          grep -inE "error|exception|could not|failed|cannot" build.log | head -n 60 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::error::--- head of build.log ---"
          head -n 40 build.log | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
