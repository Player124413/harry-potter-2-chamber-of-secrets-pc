name: Android Build

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-web:
    name: Build real WebAssembly game assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 git

      - name: Install pinned emsdk
        run: |
          set -euo pipefail
          tag=$(python3 -c "import json;print(next(s['tag'] for s in json.load(open('ThirdParty/sources.json'))['sources'] if s['name']=='emsdk'))")
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" install "$tag"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$tag"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Configure WebAssembly build
        run: source "$EMSDK/emsdk_env.sh" && cmake --preset web-wasm64

      - name: Build WebAssembly game
        run: source "$EMSDK/emsdk_env.sh" && cmake --build --preset web-wasm64

      - name: Verify and upload WebAssembly assets
        run: |
          test -s dist/web-wasm64/hp2_game.js
          test -s dist/web-wasm64/hp2_game.wasm
          ! grep -qi "placeholder" dist/web-wasm64/hp2_game.js
          du -h dist/web-wasm64/hp2_game.js dist/web-wasm64/hp2_game.wasm
        # Keep the browser shell, fonts, and actual compiled engine together.
        # The Android job packages these exact files into its APK.
      - uses: actions/upload-artifact@v4
        with:
          name: hp2-web-assets
          path: dist/web-wasm64/
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled game assets
        uses: actions/download-artifact@v4
        with:
          name: hp2-web-assets
          path: Android/app/src/main/assets/web

      - name: Confirm APK will contain the real game module
        run: |
          test -s Android/app/src/main/assets/web/hp2_game.js
          test -s Android/app/src/main/assets/web/hp2_game.wasm
          ! grep -qi "placeholder" Android/app/src/main/assets/web/hp2_game.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build debug APK
        working-directory: Android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Launch app and smoke-test on Android emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics
          script: |
            cd Android
            if ! gradle connectedDebugAndroidTest --stacktrace --no-daemon > emulator-test.log 2>&1; then
              cat emulator-test.log
              exit 1
            fi
            cat emulator-test.log

      - name: Annotate failure diagnostics
        if: failure()
        working-directory: Android
        run: |
          for file in build.log emulator-test.log; do
            if [ -f "$file" ]; then
              echo "::group::$file diagnostics"
              grep -inE "error|exception|could not|failed|cannot|timeout|assertion|WebGL|WebAssembly|HP2Launcher" "$file" | tail -n 100 | while IFS= read -r line; do
                echo "::error::$line"
              done
              echo "::endgroup::"
            fi
          done

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Android smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test-results
          path: |
            Android/emulator-test.log
            Android/app/build/reports/androidTests/connected/
            Android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
