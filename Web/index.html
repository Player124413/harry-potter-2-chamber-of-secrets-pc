<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Harry Potter 2</title>
<style>
  :root { color-scheme: dark; --bg: #13141c; --line: #414868; --accent: #7aa2f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
  body { display: flex; flex-direction: column; font: 14px/1.4 sans-serif; color: #c0caf5; }
  #status { flex: none; min-height: 28px; padding: 5px 10px; color: var(--accent); }
  #stage { display: flex; flex: 1; min-height: 0; position: relative; }
  #canvas { display: block; flex: 1; min-height: 0; width: 100%; background: #000; outline: none; }
  .corner { position: absolute; top: 8px; width: auto; min-height: 0; padding: 6px 12px;
    border: 1px solid var(--line); border-radius: 6px; background: rgba(19,20,28,.85);
    color: #c0caf5; z-index: 3; }
  #fullscreen-toggle { right: 8px; }
  #log-toggle { right: 52px; }
  #log { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    margin: 0; padding: 10px; overflow: auto; z-index: 2; background: #0a0a0a;
    border-top: 1px solid var(--line); color: #8a8; font: 11px/1.35 monospace; white-space: pre-wrap; }
  #log.open { display: block; }
  #hp2-folder-overlay { position: fixed; inset: 0; z-index: 10; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    padding: 24px; background: rgba(10, 10, 15, .94); color: #c0caf5; text-align: center; }
  #hp2-folder-overlay[hidden] { display: none; }
  #hp2-folder-overlay p { max-width: 36em; }
  #hp2-folder-overlay button { min-height: 48px; padding: 12px 24px; font: inherit; color: inherit;
    background: #24283b; border: 1px solid var(--accent); border-radius: 8px; }
</style>
</head>
<body>
<div id="status" role="status" aria-live="polite">Starting Harry Potter 2…</div>
<div id="stage">
  <button id="fullscreen-toggle" class="corner" title="Full screen (F)">⤢</button>
  <button id="log-toggle" class="corner" type="button">Log</button>
  <canvas id="canvas" tabindex="-1" oncontextmenu="return false;"></canvas>
  <pre id="log"></pre>
</div>
<script src="hp2_game.js"></script>
<script src="hp2-web.js"></script>
</body>
</html>
